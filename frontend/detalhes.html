<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Veículo - Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="fas fa-car-side me-2"></i>Veículos
        </a>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Início</a>
                </li>
                <li class="nav-item" id="userNav" style="display: none;">
                    <span class="nav-link" id="userInfo">
                        <i class="fas fa-user me-1"></i><span id="userNome"></span>
                    </span>
                </li>
                <li class="nav-item" id="logoutNav" style="display: none;">
                    <a class="nav-link btn-logout btn px-3" href="#" onclick="logout()">
                        Sair
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- DETALHES PRINCIPAL -->
<div class="container mt-5 mb-5">
    <div class="row g-4">
        <div class="col-lg-8 fade-in-up">
            <div class="card shadow-hover h-100">
                <img id="veiculoImg" class="card-img-top" style="height: 400px; object-fit: cover;">
                
                <div class="card-body">
                    <div id="detalhesConteudo" class="p-4"></div>
                </div>
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="form-container fade-in-up" style="height: fit-content;">
                <h4 class="text-gradient mb-4">
                    <i class="fas fa-info-circle me-2"></i>Informações Rápidas
                </h4>
                
                <div id="infoRapida" class="text-center"></div>
                
                <div class="mt-4">
                    <button class="btn btn-success w-100 mb-3" onclick="copiarContato()">
                        <i class="fas fa-whatsapp me-2"></i>Contato Vendedor
                    </button>
                    <a href="index.html" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-arrow-left me-2"></i>Voltar aos Anúncios
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer">
    <div class="container">
        <p>&copy; 2024 Veículos. Todos os direitos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
    window.onload = function() {
        carregarDetalhes();
        atualizarNavbar();
    };
    
    function atualizarNavbar() {
        const usuario = localStorage.getItem("usuarioLogado");
        const userNav = document.getElementById("userNav");
        const logoutNav = document.getElementById("logoutNav");
        const userNome = document.getElementById("userNome");
        
        if (usuario) {
            const u = JSON.parse(usuario);
            userNav.style.display = "block";
            logoutNav.style.display = "block";
            if (userNome) userNome.textContent = u.nome;
        }
    }

    function copiarContato() {
        alert("Contato do vendedor: (61) 99999-9999\nEmail: vendedor@sivv.com");
    }
    
    function copiarContato() {
        // Mock - in real app would copy seller contact
        navigator.clipboard.writeText("Contato do vendedor copiado!");
        alert("Contato copiado para área de transferência!");
    }
</script>
