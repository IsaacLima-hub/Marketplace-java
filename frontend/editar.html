<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Anúncio - Veículos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-light">
    <div class="container">
        <a class="navbar-brand" href="index.html">Veículos</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="form-container">
        <h2 class="mb-4 text-center">Editar Anúncio</h2>

        <form onsubmit="salvarEdicao(event)">
            <input type="hidden" id="anuncioId">

            <div class="mb-3">
                <label>Marca</label>
                <input type="text" id="marca" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Modelo</label>
                <input type="text" id="modelo" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Ano</label>
                <input type="number" id="ano" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Preço</label>
                <input type="number" id="preco" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>URL da Imagem</label>
                <input type="text" id="imagem" class="form-control">
            </div>

            <div class="mb-3">
                <label>Descrição</label>
                <textarea id="descricao" class="form-control" rows="4"></textarea>
            </div>

            <button class="btn btn-warning w-100" type="submit">
                Salvar Alterações
            </button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
