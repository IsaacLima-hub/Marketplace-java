<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Veículos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="login.html">
            🚗 Veículos
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">

                <h2 class="text-center mb-4">Criar Conta</h2>

                <form onsubmit="cadastrar(event)">

                    <div class="mb-3">
                        <label>Nome</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Telefone (com DDD)</label>
                        <input type="text" id="telefone" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label>Senha</label>
                        <input type="password" id="senha" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-3">
                        Cadastrar
                    </button>

                    <div class="text-center">
                        <a href="login.html">Já tenho conta</a>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 text-muted">
    © 2026 Veículos Marketplace
</footer>

<script src="script.js"></script>
</body>
</html>
