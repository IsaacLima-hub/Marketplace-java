<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🚗 Veículos</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="mb-4">Meu Perfil</h2>

            <p><strong>Nome:</strong> <span id="perfilNome"></span></p>
            <p><strong>E-mail:</strong> <span id="perfilEmail"></span></p>
            <p><strong>Telefone:</strong> <span id="perfilTelefone"></span></p>
            <p><strong>CPF:</strong> <span id="perfilCpf"></span></p>

            <hr>

            <h4>Editar Perfil</h4>

            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" id="editarNome" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="editarEmail" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" id="editarTelefone" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">CPF</label>
                <input type="text" id="editarCpf" class="form-control">
            </div>

            <button class="btn btn-success" onclick="atualizarPerfil()">
                Salvar Alterações
            </button>


            <hr>

            <h4>Alterar Senha</h4>

            <div class="mb-3">
                <label class="form-label">Senha Atual</label>
                <input type="password" id="senhaAtual" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Nova Senha</label>
                <input type="password" id="novaSenha" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar Nova Senha</label>
                <input type="password" id="confirmarSenha" class="form-control">
            </div>

            <button class="btn btn-primary" onclick="alterarSenha()">
                Alterar Senha
            </button>

            <a href="index.html" class="btn btn-secondary ms-2">
                Voltar
            </a>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080";
    const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));

    // Verifica se o usuário está logado
    if (!usuarioLogado) {
        alert("Você precisa estar logado.");
        window.location.href = "login.html";
    }
    // Função para salvar alterações do perfil
    async function salvarPerfil() {
        const nome = document.getElementById("editarNome").value;
        const email = document.getElementById("editarEmail").value;
        const telefone = document.getElementById("editarTelefone").value;
        const cpf = document.getElementById("editarCpf").value;

        const response = await fetch(
            `${API_URL}/usuarios/${usuarioLogado.id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    email: email,
                    telefone: telefone,
                    cpf: cpf
                })
            }
        );

        if (response.ok) {
            const usuarioAtualizado = await response.json();

            // Atualiza os dados no localStorage
            localStorage.setItem(
                "usuarioLogado",
                JSON.stringify(usuarioAtualizado)
            );

            // Atualiza a variável em memória
            usuarioLogado.nome = usuarioAtualizado.nome;
            usuarioLogado.email = usuarioAtualizado.email;
            usuarioLogado.telefone = usuarioAtualizado.telefone;
            usuarioLogado.cpf = usuarioAtualizado.cpf;

            // Atualiza as informações exibidas na página
            carregarPerfil();

            alert("Perfil atualizado com sucesso!");
        } else {
            alert("Erro ao atualizar perfil.");
        }
    }
    // Carrega os dados do usuário na tela
    function carregarPerfil() {
        document.getElementById("perfilNome").textContent =
            usuarioLogado.nome || "Não informado";

        document.getElementById("perfilEmail").textContent =
            usuarioLogado.email || "Não informado";

        document.getElementById("perfilTelefone").textContent =
            usuarioLogado.telefone || "Não informado";

        document.getElementById("perfilCpf").textContent =
            usuarioLogado.cpf || "Não informado";

        // Preenche os campos de edição
        document.getElementById("editarNome").value =
            usuarioLogado.nome || "";

        document.getElementById("editarEmail").value =
            usuarioLogado.email || "";

        document.getElementById("editarTelefone").value =
            usuarioLogado.telefone || "";

        document.getElementById("editarCpf").value =
            usuarioLogado.cpf || "";
    }
    // Função para alterar a senha
    async function alterarSenha() {
        const senhaAtual = document.getElementById("senhaAtual").value;
        const novaSenha = document.getElementById("novaSenha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        // Verifica se as novas senhas são iguais
        if (novaSenha !== confirmarSenha) {
            alert("As novas senhas não coincidem.");
            return;
        }

        const response = await fetch(
            `${API_URL}/usuarios/${usuarioLogado.id}/senha`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    senhaAtual: senhaAtual,
                    novaSenha: novaSenha
                })
            }
        );

        const mensagem = await response.text();

        if (response.ok) {
            alert(mensagem);

            // Atualiza os dados salvos no navegador
            usuarioLogado.senha = novaSenha;
            localStorage.setItem(
                "usuarioLogado",
                JSON.stringify(usuarioLogado)
            );

            // Limpa os campos
            document.getElementById("senhaAtual").value = "";
            document.getElementById("novaSenha").value = "";
            document.getElementById("confirmarSenha").value = "";
        } else {
            alert(mensagem);
        }
    }

        async function atualizarPerfil() {
        const nome = document.getElementById("editarNome").value;
        const email = document.getElementById("editarEmail").value;
        const telefone = document.getElementById("editarTelefone").value;
        const cpf = document.getElementById("editarCpf").value;

        const response = await fetch(
        `${API_URL}/usuarios/${usuarioLogado.id}`,
    {
        method: "PUT",
        headers: {
        "Content-Type": "application/json"
    },
        body: JSON.stringify({
        nome,
        email,
        telefone,
        cpf
    })
    }
        );

        if (!response.ok) {
        alert("Erro ao atualizar perfil.");
        return;
    }

        const usuarioAtualizado = await response.json();

        // Mantém a senha atual no localStorage
        usuarioAtualizado.senha = usuarioLogado.senha;

        // Atualiza os dados locais
        localStorage.setItem(
        "usuarioLogado",
        JSON.stringify(usuarioAtualizado)
        );

        // Atualiza a variável em memória
        Object.assign(usuarioLogado, usuarioAtualizado);

        // Recarrega os dados na tela
        carregarPerfil();

        alert("Perfil atualizado com sucesso!");
    }

    // Executa automaticamente ao abrir a página
    carregarPerfil();
</script>

</body>
</html>
